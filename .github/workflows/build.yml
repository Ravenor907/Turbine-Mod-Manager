name: build

on:
  push:
    branches: [main]
    # 0.6: words and the site alone don't need a build (pages.yml publishes site/).
    paths-ignore:
      - "site/**"
      - "README.md"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a release (only when the owner says so)"
        type: boolean
        default: false

# How many green full builds of a commit a release needs (owner, 0.63: one). Only full attempts count, and the
# release ships exactly that run's files, by artifact id and checksum.
env:
  REQUIRED_GREEN_BUILDS: 1

permissions:
  contents: read

# A newer push to main cancels the push build it replaces. 0.61: every dispatched run (a release, or one of the
# green runs for one) has a group of its own, so runs started side by side never cancel each other.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # 0.6: a release publishes the checked bundle of a green run of the same commit (its artifact's digest checked),
  # never a new build; with no such run it stops here. Other runs find nothing to reuse and build in full.
  reuse:
    name: A checked build of this commit?
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
      ids: ${{ steps.find.outputs.ids }}
    steps:
      - id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          ids=""
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.release }}" = true ]; then
            sha="${{ github.sha }}"
            # The standing method: a release needs every check green on this commit REQUIRED_GREEN_BUILDS times
            # (fresh runs or full reruns), and ships the bundle and plugin such a run built, never a new build.
            # 0.61: dispatched runs (not releases) count as well as pushes. A run counts only when it built the
            # bundle (a release that reused a build has none). The run shipped is one whose latest attempt is green,
            # and its files must come from that attempt (made between its start and its end), never from an
            # earlier or later failed one (N2).
            repo="${{ github.repository }}"
            # 0.64: a commit that changes only paths this workflow ignores on push (site/, *.md, pages.yml: the
            # paths-ignore list at the top, mirrored in the case line below and checked by tools/release-check.py)
            # has no build of its own. Its release reuses the green build of the newest commit before it that
            # changed anything else; the release is still tagged on this commit.
            built="$sha"
            for step in $(seq 1 30); do
              files=$(gh api "repos/$repo/commits/$built" --jq '.files[].filename')
              parents=$(gh api "repos/$repo/commits/$built" --jq '.parents | length')
              [ -n "$files" ] && [ "$parents" = 1 ] || break
              only_ignored=1
              while IFS= read -r f; do
                case "$f" in site/*|*.md|.github/workflows/pages.yml) ;; *) only_ignored=0 ;; esac
              done <<< "$files"
              [ "$only_ignored" = 1 ] || break
              built=$(gh api "repos/$repo/commits/$built" --jq '.parents[0].sha')
            done
            if [ "$built" != "$sha" ]; then
              echo "::notice title=Only ignored paths changed::$sha changes only site/, *.md or pages.yml since $built: the release reuses $built's green build"
              sha="$built"
            fi
            greens=0
            for r in $(gh api "repos/$repo/actions/workflows/build.yml/runs?head_sha=$sha&per_page=50" \
                         --jq ".workflow_runs[] | select(.head_sha == \"$sha\" and (.event == \"push\" or .event == \"workflow_dispatch\") and .id != ${{ github.run_id }}) | .id"); do
              arts=$(gh api "repos/$repo/actions/runs/$r/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false)]')
              [ "$(echo "$arts" | jq '[.[] | select(.name == "TurbineModManager.flatpak")] | length')" -gt 0 ] || continue
              n=$(gh api "repos/$repo/actions/runs/$r" --jq .run_attempt)
              for a in $(seq 1 "$n"); do
                read -r c from to < <(gh api "repos/$repo/actions/runs/$r/attempts/$a" --jq '"\(.conclusion) \(.run_started_at) \(.updated_at)"')
                [ "$c" = success ] || continue
                # 0.62: only a full attempt counts. "Re-run failed jobs" makes an attempt in which the jobs that
                # passed before are carried over (they keep their earlier attempt's number): that attempt checked
                # only part of the build again.
                carried=$(gh api "repos/$repo/actions/runs/$r/attempts/$a/jobs?per_page=100" --jq "[.jobs[] | select(.run_attempt != $a)] | length")
                [ "$carried" = 0 ] || continue
                greens=$((greens + 1))
                if [ -z "$run" ] && [ "$a" = "$n" ]; then
                  ok=1
                  for name in TurbineModManager.flatpak Turbine-Decky.zip; do
                    made=$(echo "$arts" | jq -r --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.created_at) | last | .created_at // ""')
                    if [ -z "$made" ] || [[ "$made" < "$from" ]] || [[ "$made" > "$to" ]]; then ok=0; fi
                  done
                  [ "$ok" = 1 ] && run=$r
                fi
              done
            done
            echo "::notice title=Green runs of this commit::$greens"
            if [ "$greens" -lt "$REQUIRED_GREEN_BUILDS" ]; then
              echo "::error title=Not enough green builds::commit $sha has $greens green full builds and a release needs $REQUIRED_GREEN_BUILDS; run or rerun the build until every check is green"
              exit 1
            fi
            if [ -z "$run" ]; then
              echo "::error title=No run to ship::no run of $sha has a green latest attempt with its own files; run the build once more"
              exit 1
            fi
            for name in TurbineModManager.flatpak Turbine-Decky.zip; do
              art=$(gh api "repos/$repo/actions/runs/$run/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false)] | sort_by(.created_at) | last | \"\(.id) \(.digest)\"")
              if [ -z "$art" ] || [ "$art" = "null null" ] || [ "${art#* }" = null ]; then echo "::error title=$name is gone::run $run's artifact expired or has no digest; push a new commit and get it green"; exit 1; fi
              echo "::notice title=Release reuses run $run::$name, artifact $art"
              ids="${ids:+$ids,}${art%% *}"
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "ids=${ids:-}" >> "$GITHUB_OUTPUT"

  rules:
    name: House rules
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: No em or en dashes, no attribution, no other mod managers' names
        shell: bash
        run: |
          fail=0
          hits=$(git grep -n -I -F "$(printf '\342\200\224')" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Em dash"; echo "$hits"; fail=1; fi
          hits=$(git grep -n -I -F "$(printf '\342\200\223')" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::En dash"; echo "$hits"; fail=1; fi
          pattern=$(printf '%s' 'Y28tYXV0aG9yZWQtYnl8YW50aHJvcGljfGNsYXVkZXxjaGF0Z3B0fGNvcGlsb3Q=' | base64 -d)
          hits=$(git grep -n -I -i -E "$pattern" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Attribution"; echo "$hits"; fail=1; fi
          # Kept encoded so this file doesn't name them either.
          pattern=$(printf '%s' 'XGIoYW1ldGh5c3R8dm9ydGV4fG1vZCA/b3JnYW5pW3N6XWVyfHIybW9kbWFufGdhbGV8bGltb3xkZWNreS1uZXh1cylcYg==' | base64 -d)
          hits=$(git grep -n -I -i -E "$pattern" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Another mod manager is named"; echo "$hits"; fail=1; fi
          exit $fail
      - name: No stale words (Nexus opens inside Turbine, so there is nothing to come back from)
        shell: bash
        run: |
          # The tutorial, the next-requirement sheet and the free-account words once taught "Steam button, then
          # Turbine"; the page is Turbine's own now. (The outside-browser ways in Labs and Desktop Mode still say it.)
          hits=$( { grep -n -E "Steam button" app/qml/Tutorial.qml app/src/online.rs app/src/catch.rs || true; grep -n 'sheet === "chain"' app/qml/Main.qml | grep "Steam button" || true; } )
          if [ -n "$hits" ]; then echo "::error title=Stale words::Steam button, then Turbine is still taught"; echo "$hits"; exit 1; fi
          echo "No stale Steam button words"
      - name: QML syntax (seconds here instead of minutes into the Flatpak build)
        shell: bash
        run: node tools/qml-check.js app/qml/*.qml
      - name: Release rules (the green builds a release needs, the same Flatpak and Decky zip, checksums, a pinned plugin)
        shell: bash
        run: python3 tools/release-check.py
      - name: Commits are the owner's
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          want=Ravenor907@users.noreply.github.com
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD -1"
          fi
          bad=$(git log --format='%h %ae %ce' $range | awk -v w="$want" '$2 != w || $3 != w')
          if [ -n "$bad" ]; then echo "::error title=House rule broken::Commit author or committer isn't $want"; echo "$bad"; exit 1; fi
          echo "Checked: $(git log --format=%h $range | wc -l) commit(s)"
      - name: Version
        id: v
        shell: bash
        run: |
          v=$(head -n1 VERSION | tr -d '\r')
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::VERSION must look like 0.3 or 1.0, not \"$v\""; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine tests
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # The pinned toolchain and the engine's build folder, kept between runs (the engine has no outside crates).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.rustup/toolchains/1.97.0-*
            ~/.rustup/update-hashes/1.97.0-*
            target
          key: engine-1.97.0-${{ hashFiles('engine/**', 'Cargo.lock') }}
          restore-keys: engine-1.97.0-
      - name: Test and lint the engine
        shell: bash
        run: |
          # A pinned toolchain, so a newer runner (with new lints) can't break the build by itself.
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          cd engine
          cargo +1.97.0 test --release
          cargo +1.97.0 clippy --all-targets -- -D warnings
      - name: Build the engine as a plain library (the app files tested below need only the engine)
        shell: bash
        run: |
          mkdir -p /tmp/engine
          # The engine's built-in game data (build.rs does this under cargo).
          rustc +1.97.0 --edition 2024 -O engine/build.rs -o /tmp/engine/gen
          CARGO_MANIFEST_DIR="$PWD/engine" OUT_DIR=/tmp/engine /tmp/engine/gen > /dev/null
          OUT_DIR=/tmp/engine rustc +1.97.0 --edition 2024 -O --crate-type rlib --crate-name turbine_engine engine/src/lib.rs -o /tmp/engine/libturbine_engine.rlib
      - name: Test the browser helper's link (app/src/bridge.rs)
        shell: bash
        run: |
          rustc +1.97.0 --edition 2024 --test app/src/bridge.rs --extern turbine_engine=/tmp/engine/libturbine_engine.rlib -o /tmp/engine/bridge-tests
          /tmp/engine/bridge-tests
          # Turbine's end of Sign in with my browser, from the same bridge.rs, for the helper's whole-handshake check.
          rustc +1.97.0 --edition 2024 tools/signin-standin.rs --extern turbine_engine=/tmp/engine/libturbine_engine.rlib -o /tmp/engine/signin-standin
      - name: Test the controller pointer (app/src/pointer.rs needs only the standard library)
        shell: bash
        run: |
          rustc +1.97.0 --edition 2024 --test app/src/pointer.rs -o /tmp/pointer-tests
          /tmp/pointer-tests
      - name: Test Turbine's browser decisions (app/src/browse.rs)
        shell: bash
        run: |
          rustc +1.97.0 --edition 2024 --test app/src/browse.rs --extern turbine_engine=/tmp/engine/libturbine_engine.rlib -o /tmp/engine/browse-tests
          /tmp/engine/browse-tests
      - name: Test Nexus single sign-on against a stand-in server (app/src/nexus_sso.rs)
        shell: bash
        run: |
          rustc +1.97.0 --edition 2024 --test app/src/nexus_sso.rs --extern turbine_engine=/tmp/engine/libturbine_engine.rlib -o /tmp/engine/sso-tests
          /tmp/engine/sso-tests
      - name: Test the browser helper (extension/, Node 22)
        shell: bash
        run: |
          node --version
          cd extension && node test/test.js
          # Sign in with my browser end to end: the helper's service worker against Turbine's real bridge server,
          # with a mocked Nexus sign-in and API Keys page.
          TURBINE_STANDIN=/tmp/engine/signin-standin node test/handshake.js

  nexus:
    name: Nexus without a key (live)
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Send Nexus's public GraphQL the exact requests Turbine sends, with no key
        shell: bash
        run: |
          # The bodies come from the engine itself. Nexus being down or slow is only a warning; a GraphQL errors
          # answer to one of Turbine's own requests fails the job (every player would get it too).
          rustup toolchain install 1.97.0 --profile minimal > /dev/null
          (cd engine && TURBINE_QUERY_OUT=/tmp/nexus-queries cargo +1.97.0 test --release -q --test complexity)
          sh tools/nexus-live.sh /tmp/nexus-queries

  # 0.6: the optional Steam menu plugin (decky/), on its own beside the other jobs (nothing waits for it but a
  # release). Decky's template build (rollup), its typecheck and tests, then the zip Decky installs from.
  decky:
    name: Steam menu plugin (Decky)
    needs: [reuse]
    # A release ships the plugin the green runs built (reuse), never a new build.
    if: needs.reuse.outputs.run == ''
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Typecheck, test and build the plugin
        shell: bash
        working-directory: decky
        run: |
          node --version
          npm install -g pnpm@9.15.9 > /dev/null
          pnpm --version
          # The plugin's packages are pinned in the committed pnpm-lock.yaml; a build without it would pick new ones.
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only > /dev/null
            echo "LOCKFILE $(base64 -w0 pnpm-lock.yaml)"
            echo "::error title=decky/pnpm-lock.yaml missing::Commit the lockfile (printed above as LOCKFILE) so every build uses the same packages"
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm run typecheck
          python3 -m py_compile main.py
          pnpm run test
          pnpm run build
          test -s dist/index.js || { echo "::error title=Plugin build::dist/index.js wasn't made"; exit 1; }
      - name: Zip it the way Decky installs it
        shell: bash
        run: |
          v=$(head -n1 VERSION | tr -d '\r')
          out=decky/out/Turbine
          rm -rf decky/out && mkdir -p "$out/dist" "$out/assets"
          cp decky/dist/index.js "$out/dist/"
          cp decky/main.py decky/plugin.json "$out/"
          cp decky/assets/icon.png "$out/assets/"
          cp LICENSE "$out/LICENSE"
          # Decky shows the plugin's version from package.json: Turbine's own (one dot, as everywhere).
          node -e 'const fs=require("fs"), p=JSON.parse(fs.readFileSync(process.argv[1])); p.version=process.argv[3]; delete p.devDependencies; fs.writeFileSync(process.argv[2], JSON.stringify(p, null, 2) + "\n")' decky/package.json "$out/package.json" "$v"
          (cd decky/out && zip -qr ../../Turbine-Decky.zip Turbine)
          sha256sum Turbine-Decky.zip | tee Turbine-Decky.zip.sha256
          unzip -l Turbine-Decky.zip
          echo "::notice title=Turbine-Decky.zip::$(stat -c %s Turbine-Decky.zip) bytes, version $v"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Turbine-Decky.zip
          path: |
            Turbine-Decky.zip
            Turbine-Decky.zip.sha256
          retention-days: 30

  vendor:
    name: Rust crates for the offline Flatpak build
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Vendor the locked crates
        shell: bash
        run: |
          # The crate versions are pinned in the committed Cargo.lock; a build without it would pick new ones.
          [ -f Cargo.lock ] || { echo "::error title=Cargo.lock missing::Commit Cargo.lock so every build uses the same crate versions"; exit 1; }
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          du -sh vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vendor
          path: |
            vendor
            .cargo/config.toml
            Cargo.lock
          include-hidden-files: true
          retention-days: 3

  flatpak:
    name: Flatpak
    # Starts without waiting for the engine tests (they run beside it; a failure still fails the run and blocks
    # a release).
    needs: [rules, vendor, reuse]
    if: needs.reuse.outputs.run == ''
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: vendor
          path: .
      - name: Fonts
        run: sh tools/get-fonts.sh
      - name: Version
        shell: bash
        env:
          VERSION: ${{ needs.rules.outputs.version }}
        run: |
          m=packaging/io.github.ravenor907.TurbineModManager.json
          sed -i -E "s|\"TURBINE_VERSION\": \"[0-9.]+\"|\"TURBINE_VERSION\": \"$VERSION\"|" "$m"
          grep -q "\"TURBINE_VERSION\": \"$VERSION\"" "$m" || { echo "::error::The version didn't go into the Flatpak manifest"; exit 1; }
          # The commit goes in beside the app (read by app/build.rs), so the manifest and its build cache stay the same.
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          git rev-parse --short=9 HEAD > app/build-commit.txt || echo "${GITHUB_SHA:0:9}" > app/build-commit.txt
          cat app/build-commit.txt
      # The KDE runtime and SDK, the Rust SDK extension and the Qt WebEngine BaseApp, installed once and kept (flatpak-
      # builder still updates them from Flathub when a newer build is out).
      # 0.6: the caches are restored every run but saved only when their key is new (saving took 105 s a run).
      # The runtimes and BaseApp, keyed on the manifest (their versions are there).
      - id: sdkcache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            /var/lib/flatpak
            ~/.local/share/flatpak
          key: flatpak-sdk-${{ hashFiles('packaging/*.json') }}
          restore-keys: flatpak-sdk-
      # flatpak-builder's state (sources, ccache, modules that didn't change), keyed on the manifest and the locked
      # crates; a change to Turbine's own code reuses it.
      - id: fbcache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .flatpak-builder
          key: fb2-${{ hashFiles('packaging/*.json', 'Cargo.lock') }}
          restore-keys: fb2-
      - name: Build Flatpak
        shell: bash
        env:
          KEEP: ${{ runner.environment == 'self-hosted' && '/__w/_keep' || '' }}
        run: |
          # 0.65: on the owner's PC (TURBINE_RUNNER=local) the runtimes and flatpak-builder's state stay in the
          # runner's own folder between runs instead of going through the GitHub cache.
          state=.flatpak-builder
          if [ -n "$KEEP" ]; then export FLATPAK_SYSTEM_DIR="$KEEP/flatpak-system"; state="$KEEP/flatpak-builder"; fi
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          set +e
          flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean --ccache --install-deps-from=flathub \
            --state-dir="$state" flatpak_app packaging/io.github.ravenor907.TurbineModManager.json > build.log 2>&1
          code=$?
          set -e
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            errs=$(grep -E "^error|error\[|error:|Error:|undefined reference|cannot find" build.log | head -n 30 | cut -c1-240 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$errs" ] && echo "::error title=Build errors::$errs"
            exit 1
          fi
          flatpak build-bundle repo TurbineModManager.flatpak io.github.ravenor907.TurbineModManager \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          # The bundle carries Qt WebEngine now (the BaseApp is merged in): its real size, and a gate at 300 MB.
          bytes=$(stat -c %s TurbineModManager.flatpak)
          mb=$(( (bytes + 524288) / 1048576 ))
          echo "::notice title=TurbineModManager.flatpak::$bytes bytes ($mb MB)"
          if [ "$bytes" -gt $((300 * 1048576)) ]; then echo "::error title=Bundle too big::$mb MB, over the 300 MB limit"; exit 1; fi
          sha256sum TurbineModManager.flatpak | tee TurbineModManager.flatpak.sha256
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: runner.environment == 'github-hosted' && steps.sdkcache.outputs.cache-hit != 'true'
        with:
          path: |
            /var/lib/flatpak
            ~/.local/share/flatpak
          key: flatpak-sdk-${{ hashFiles('packaging/*.json') }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: runner.environment == 'github-hosted' && steps.fbcache.outputs.cache-hit != 'true'
        with:
          path: .flatpak-builder
          key: fb2-${{ hashFiles('packaging/*.json', 'Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: TurbineModManager.flatpak
          path: |
            TurbineModManager.flatpak
            TurbineModManager.flatpak.sha256
          retention-days: 30

  # The pictures and checks, in four parts side by side, each on the bundle the Flatpak job made.
  checks:
    name: Checks (${{ matrix.part }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [flatpak]
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    strategy:
      fail-fast: false
      # 0.6: each size's pictures split over parallel shards (tools/ci-shots.sh plans them by run time). 0.65: 8 and 6
      # shards (the setup is about 2 minutes of each job, the pictures the rest).
      matrix:
        include:
          - { part: 1280x800, shard: 0, shards: 8 }
          - { part: 1280x800, shard: 1, shards: 8 }
          - { part: 1280x800, shard: 2, shards: 8 }
          - { part: 1280x800, shard: 3, shards: 8 }
          - { part: 1280x800, shard: 4, shards: 8 }
          - { part: 1280x800, shard: 5, shards: 8 }
          - { part: 1280x800, shard: 6, shards: 8 }
          - { part: 1280x800, shard: 7, shards: 8 }
          - { part: 1920x1080, shard: 0, shards: 6 }
          - { part: 1920x1080, shard: 1, shards: 6 }
          - { part: 1920x1080, shard: 2, shards: 6 }
          - { part: 1920x1080, shard: 3, shards: 6 }
          - { part: 1920x1080, shard: 4, shards: 6 }
          - { part: 1920x1080, shard: 5, shards: 6 }
          - { part: x11, shard: 0, shards: 1 }
          - { part: nexus, shard: 0, shards: 1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: TurbineModManager.flatpak
          path: .
      # The KDE runtime the bundle runs on (not Turbine itself, installed fresh each time): one cache for every shard,
      # saved only when the manifest changes.
      - id: rtcache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.local/share/flatpak
            !~/.local/share/flatpak/app/io.github.ravenor907.TurbineModManager
          key: flatpak-runtime-${{ matrix.part == 'x11' && 'x11' || matrix.part == 'nexus' && 'nexus' || 'pics' }}-${{ hashFiles('packaging/*.json') }}
          restore-keys: flatpak-runtime-${{ matrix.part == 'x11' && 'x11' || matrix.part == 'nexus' && 'nexus' || 'pics' }}-
      - name: Pictures and checks (${{ matrix.part }})
        shell: bash
        env:
          KEEP: ${{ runner.environment == 'self-hosted' && '/__w/_keep' || '' }}
        run: |
          # 0.65: on the owner's PC each runner keeps its own Flatpak user folder between runs.
          if [ -n "$KEEP" ]; then export FLATPAK_USER_DIR="$KEEP/flatpak-user"; fi
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          bash tools/ci-shots.sh "${{ matrix.part }}" "${{ matrix.shard }}" "${{ matrix.shards }}"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: runner.environment == 'github-hosted' && steps.rtcache.outputs.cache-hit != 'true' && matrix.shard == 0
        with:
          path: |
            ~/.local/share/flatpak
            !~/.local/share/flatpak/app/io.github.ravenor907.TurbineModManager
          key: flatpak-runtime-${{ matrix.part == 'x11' && 'x11' || matrix.part == 'nexus' && 'nexus' || 'pics' }}-${{ hashFiles('packaging/*.json') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: screenshots-${{ matrix.part }}-${{ matrix.shard }}
          path: shots
          retention-days: 14

  release:
    name: Release (owner approved)
    needs: [reuse, rules, engine, flatpak, checks, decky]
    # Only the bundle and plugin a green run of the same commit built and checked (found by reuse), never a new build.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.release &&
      needs.reuse.result == 'success' && needs.reuse.outputs.run != '' && needs.rules.result == 'success' && needs.engine.result == 'success'
    runs-on: ${{ vars.TURBINE_RUNNER == 'local' && fromJSON('["self-hosted", "turbine"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: read
    steps:
      # Both files from the green runs of this commit (same commit, artifact digests checked when downloaded).
      # 0.61 (N2): by the exact artifacts the reuse job chose (made by the run's green latest attempt).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.reuse.outputs.ids }}
          merge-multiple: true
          path: .
          run-id: ${{ needs.reuse.outputs.run }}
          github-token: ${{ github.token }}
      - name: Both files are the ones that were checked
        shell: bash
        run: |
          for f in TurbineModManager.flatpak Turbine-Decky.zip; do
            [ -f "$f.sha256" ] || { echo "::error title=No checksum beside $f::nothing is released without it"; exit 1; }
            sha256sum -c "$f.sha256"
            echo "::notice title=Releasing::$(sha256sum "$f") from run ${{ needs.reuse.outputs.run }}"
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ needs.rules.outputs.version }}
          name: Turbine Mod Manager ${{ needs.rules.outputs.version }}
          prerelease: false
          files: |
            TurbineModManager.flatpak
            TurbineModManager.flatpak.sha256
            Turbine-Decky.zip
            Turbine-Decky.zip.sha256
          body: |
            Test build for SteamOS handhelds. Download TurbineModManager.flatpak in Desktop Mode and open it to install.
