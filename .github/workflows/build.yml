name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a release (only when the owner says so)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: House rules
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: No em or en dashes, no attribution, no other mod managers' names
        shell: bash
        run: |
          fail=0
          hits=$(git grep -n -I -F "$(printf '\342\200\224')" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Em dash"; echo "$hits"; fail=1; fi
          hits=$(git grep -n -I -F "$(printf '\342\200\223')" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::En dash"; echo "$hits"; fail=1; fi
          pattern=$(printf '%s' 'Y28tYXV0aG9yZWQtYnl8YW50aHJvcGljfGNsYXVkZXxjaGF0Z3B0fGNvcGlsb3Q=' | base64 -d)
          hits=$(git grep -n -I -i -E "$pattern" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Attribution"; echo "$hits"; fail=1; fi
          # Kept encoded so this file doesn't name them either.
          pattern=$(printf '%s' 'XGIoYW1ldGh5c3R8dm9ydGV4fG1vZCA/b3JnYW5pW3N6XWVyfHIybW9kbWFufGdhbGV8bGltb3xkZWNreS1uZXh1cylcYg==' | base64 -d)
          hits=$(git grep -n -I -i -E "$pattern" -- . | head -n 20 || true)
          if [ -n "$hits" ]; then echo "::error title=House rule broken::Another mod manager is named"; echo "$hits"; fail=1; fi
          exit $fail
      - name: Commits are the owner's
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          want=Ravenor907@users.noreply.github.com
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD -1"
          fi
          bad=$(git log --format='%h %ae %ce' $range | awk -v w="$want" '$2 != w || $3 != w')
          if [ -n "$bad" ]; then echo "::error title=House rule broken::Commit author or committer isn't $want"; echo "$bad"; exit 1; fi
          echo "Checked: $(git log --format=%h $range | wc -l) commit(s)"
      - name: Version
        id: v
        shell: bash
        run: |
          v=$(head -n1 VERSION | tr -d '\r')
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::VERSION must look like 0.3 or 1.0, not \"$v\""; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Test and lint the engine
        shell: bash
        run: |
          # A pinned toolchain, so a newer runner (with new lints) can't break the build by itself.
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          cd engine
          cargo +1.97.0 test --release
          cargo +1.97.0 clippy --all-targets -- -D warnings

  vendor:
    name: Rust crates for the offline Flatpak build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Vendor the locked crates
        shell: bash
        run: |
          # The crate versions are pinned in the committed Cargo.lock; a build without it would pick new ones.
          [ -f Cargo.lock ] || { echo "::error title=Cargo.lock missing::Commit Cargo.lock so every build uses the same crate versions"; exit 1; }
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          du -sh vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vendor
          path: |
            vendor
            .cargo/config.toml
            Cargo.lock
          include-hidden-files: true
          retention-days: 3

  flatpak:
    name: Flatpak
    needs: [rules, engine, vendor]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: vendor
          path: .
      - name: Fonts
        run: sh tools/get-fonts.sh
      - name: Version
        shell: bash
        env:
          VERSION: ${{ needs.rules.outputs.version }}
        run: |
          m=packaging/io.github.ravenor907.TurbineModManager.json
          sed -i -E "s|\"TURBINE_VERSION\": \"[0-9.]+\"|\"TURBINE_VERSION\": \"$VERSION\"|" "$m"
          grep -q "\"TURBINE_VERSION\": \"$VERSION\"" "$m" || { echo "::error::The version didn't go into the Flatpak manifest"; exit 1; }
          # The commit goes in beside the app (read by app/build.rs), so the manifest and its build cache stay the same.
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          git rev-parse --short=9 HEAD > app/build-commit.txt || echo "${GITHUB_SHA:0:9}" > app/build-commit.txt
          cat app/build-commit.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .flatpak-builder
          key: fb-${{ hashFiles('packaging/*.json', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: fb-${{ hashFiles('packaging/*.json', 'Cargo.lock') }}-
      - name: Build Flatpak
        shell: bash
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          set +e
          flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean --ccache --install-deps-from=flathub \
            --state-dir=.flatpak-builder flatpak_app packaging/io.github.ravenor907.TurbineModManager.json > build.log 2>&1
          code=$?
          set -e
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            errs=$(grep -E "^error|error\[|error:|Error:|undefined reference|cannot find" build.log | head -n 30 | cut -c1-240 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$errs" ] && echo "::error title=Build errors::$errs"
            exit 1
          fi
          flatpak build-bundle repo TurbineModManager.flatpak io.github.ravenor907.TurbineModManager \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          echo "::notice title=TurbineModManager.flatpak::$(stat -c %s TurbineModManager.flatpak) bytes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
      - name: Screenshots at Steam Deck and Ally X sizes (fails on any QML error)
        shell: bash
        run: |
          flatpak install --user -y --noninteractive TurbineModManager.flatpak > /dev/null
          # The programs the engine runs from the runtime: curl (downloads) and bsdtar (7z and rar).
          for tool in curl bsdtar; do
            if v=$(flatpak run --command=$tool io.github.ravenor907.TurbineModManager --version 2>&1 | head -n1); then
              echo "::notice title=$tool in the Flatpak::$v"
            else
              echo "::error title=$tool missing from the Flatpak::$v"; exit 1
            fi
          done
          mkdir -p shots home empty data samples
          python3 tools/fake-home.py "$PWD/home"
          # Recorded answers instead of the internet: the engine's samples, then the app's own.
          cp engine/tests/data/*.json engine/tests/data/*.html samples/
          cp tools/selftest-data/* samples/
          fail=0
          shoot() {   # shoot <name> <WxH> <page> <home> [more arguments]
            name=$1 size=$2 page=$3 home=$4
            shift 4
            out="$PWD/shots/$name.png"
            # Each picture gets its own mod store, so imports never pile up between pictures.
            timeout 60 dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen --env=QT_QUICK_BACKEND=software \
              --env=TURBINE_HOME="$home" --env=TURBINE_DATA="$PWD/data/$name" \
              --filesystem="$PWD/shots" --filesystem="$home" --filesystem="$PWD/data" --filesystem="$PWD/samples:ro" \
              io.github.ravenor907.TurbineModManager --screenshot="$out" --size="$size" --page="$page" --selftest-data="$PWD/samples" "$@" > "shots/$name.log" 2>&1
            if [ ! -s "$out" ]; then echo "::error title=No screenshot::$name"; cat "shots/$name.log"; fail=1; fi
            if grep -E "qrc:|\.qml:[0-9]+|TypeError|ReferenceError" "shots/$name.log"; then echo "::error title=QML problem::$name"; fail=1; fi
            # The engine answers "not ready" while parts of it are unfinished; say so without failing the build.
            if grep -q "not yet implemented" "shots/$name.log"; then echo "::warning title=Engine not finished::$name"; fi
          }
          dl="$PWD/home/Downloads"
          skyrim=steam:489830
          for size in 1280x800 1920x1080; do
            for page in game settings details perf notice; do shoot "$page-$size" "$size" "$page" "$PWD/home"; done
            shoot "nogames-$size" "$size" game "$PWD/empty"
            shoot "mods-skyrim-$size" "$size" mods "$PWD/home" --game=$skyrim \
              "--selftest-import=$dl/Brighter Lanterns 1.2.zip,$dl/Lantern Glow SKSE 2.0.zip"
            shoot "mods-valheim-$size" "$size" mods "$PWD/home" --game=steam:892970 "--selftest-import=$dl/TurbineTest-Bigger_Pockets-1.0.3.zip"
            shoot "mods-stardew-$size" "$size" mods "$PWD/home" --game=gog:1453375253 "--selftest-import=$dl/Quiet Rooster 1.4.zip"
            shoot "menu-$size" "$size" menu "$PWD/home" --game=$skyrim "--selftest-import=$dl/Brighter Lanterns 1.2.zip"
            shoot "gamemenu-$size" "$size" gamemenu "$PWD/home" --game=$skyrim
            shoot "check-$size" "$size" check "$PWD/home" --game=$skyrim "--selftest-import=$dl/Lantern Glow SKSE 2.0.zip"
            shoot "add-$size" "$size" add "$PWD/home" --game=$skyrim
            shoot "loader-$size" "$size" loader "$PWD/home" --game=$skyrim "--selftest-import=$dl/Lantern Glow SKSE 2.0.zip"
            # Labs mode and Seasonal (neither is saved from a picture).
            for page in about labs perfcheck; do shoot "$page-$size" "$size" "$page" "$PWD/home"; done
            shoot "report-$size" "$size" report "$PWD/home" --game=$skyrim
            shoot "autumn-$size" "$size" mods "$PWD/home" --game=steam:892970 --season=autumn "--selftest-import=$dl/TurbineTest-Bigger_Pockets-1.0.3.zip"
            shoot "snow-$size" "$size" settings "$PWD/home" --season=snow
            # 0.3: Get Mods, details, installer choices, load order, profiles, accounts, updates.
            lethal=steam:1966720
            shoot "browse-$size" "$size" browse "$PWD/home" --game=$lethal
            shoot "moddetails-$size" "$size" moddetails "$PWD/home" --game=$lethal
            shoot "fomod-$size" "$size" fomod "$PWD/home" --game=$skyrim "--selftest-import=$dl/Lush Meadows 1.0.zip"
            shoot "loadorder-$size" "$size" loadorder "$PWD/home" --game=$skyrim
            shoot "profiles-$size" "$size" profiles "$PWD/home" --game=$skyrim
            shoot "accounts-$size" "$size" accounts "$PWD/home"
            shoot "updates-$size" "$size" updates "$PWD/home"
            # LOOT sorting with the recorded sample masterlist (on a copy of the home, since sorting writes plugins.txt).
            for page in lootsort lootnotes; do
              rm -rf "$PWD/lhome" && cp -a "$PWD/home" "$PWD/lhome"
              shoot "$page-$size" "$size" $page "$PWD/lhome" --game=$skyrim
            done
            shoot "versions-$size" "$size" versions "$PWD/home" --game=$lethal
            shoot "code-$size" "$size" code "$PWD/home" --game=$lethal \
              "--selftest-import=$dl/TurbineTest-Bigger_Pockets-1.0.3.zip|thunderstore|TurbineTest-Bigger_Pockets|1.0.3"
          done
          ls -la shots
          # Also into the log, so the pictures can be checked where artifacts can't be downloaded.
          for f in shots/*.png; do echo "SHOT $(basename "$f") $(base64 -w0 "$f")"; done
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: TurbineModManager.flatpak
          path: TurbineModManager.flatpak
          retention-days: 30

  release:
    name: Release (owner approved)
    needs: [rules, flatpak]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: TurbineModManager.flatpak
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ needs.rules.outputs.version }}
          name: Turbine Mod Manager ${{ needs.rules.outputs.version }}
          prerelease: ${{ startsWith(needs.rules.outputs.version, '0.') }}
          files: TurbineModManager.flatpak
          body: |
            Test build for SteamOS handhelds. Download TurbineModManager.flatpak in Desktop Mode and open it to install.
