name: site

# Publishes site/ to GitHub Pages straight from main: no build step and no extra branch.
# Pages must be set to "GitHub Actions" in the repository's settings (Settings, Pages, Source) once.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push waits instead of cutting a publish off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    name: Pack the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Every page and picture the site points to is there
        shell: bash
        run: |
          fail=0
          for ref in $(grep -ohE '(src|href)="[^"#:]+"' site/*.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            [ -e "site/$ref" ] || { echo "::error title=Missing from site/::$ref"; fail=1; }
          done
          exit $fail
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
